project:
  type: website
  output-dir: _site
  resources:
    - assets/
    - "!_archive/"

execute:
  freeze: true

jupyter: python3

website:
  title: "Konstantin Unruh"
  description: "Konstantin Unruh's notes on physics, Linux and more."
  site-url: "https://freaxmate.github.io/website"  # overridden in CI from the SITE_DOMAIN variable
  repo-url: "https://github.com/FreaxMATE/website"
  repo-branch: source
  favicon: assets/favicon.svg
  open-graph: true
  page-navigation: true
  back-to-top-navigation: true

  navbar:
    pinned: false
    search: true
    left:
      - text: Physics
        href: docs/physics/index.qmd
      - text: Linux
        href: docs/linux/index.qmd
    right:
      - icon: github
        href: https://github.com/FreaxMATE
        aria-label: GitHub
    tools:
      - icon: rss
        href: index.xml
        aria-label: RSS feed

  page-footer:
    left: "© 2022–2026 Konstantin Unruh"
    center: ""
    right:
      - text: Source
        href: https://github.com/FreaxMATE/website
      - text: RSS
        href: index.xml
      - text: Built with Quarto
        href: https://quarto.org

format:
  html:
    theme:
      light: [default, brand, styles/site.scss]
      dark: [default, brand, styles/site.scss]
    respect-user-color-scheme: true
    code-fold: false
    code-tools: false
    code-copy: true
    toc: true
    toc-depth: 3
    number-sections: false
    highlight-style: github
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - file: _includes/analytics.html
