<script>
document.addEventListener('DOMContentLoaded', function() {
  const downloadBtn = document.querySelector('.download-pdf-button');
  const pdfLink = document.getElementById('pdf-download-link');
  
  if (downloadBtn && pdfLink) {
    // Check if this is an index/section landing page
    const isIndexPage = window.location.pathname.endsWith('/') || 
                        window.location.pathname.endsWith('index.html') ||
                        window.location.pathname === '/';
    
    // Hide button on section landing pages
    if (isIndexPage) {
      downloadBtn.style.display = 'none';
      return;
    }
    
    // Construct the PDF path based on current URL
    let pdfPath = window.location.pathname
      .replace(/\.html$/, '') // Remove .html
      .replace(/\/$/, ''); // Remove trailing slash
    
    // Handle root page
    if (!pdfPath || pdfPath === '') {
      pdfPath = '/index';
    }
    
    // Set the href to the pre-generated PDF
    pdfPath = pdfPath + '.pdf';
    pdfLink.href = pdfPath;
    pdfLink.download = pdfPath.split('/').pop() || 'index.pdf';
    pdfLink.target = '_blank'; // Open in new tab but still download
  }
});
</script>
